name: CI

on:
  push:

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run install script
        run: |
          bash install.sh

  linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker
        run: |
          cat > Dockerfile <<'EOF'
          FROM ubuntu:24.04
          RUN apt-get update
          RUN apt-get install --yes curl git lsb-release sudo python3
          ENV SHELL=bash
          CMD ["/bin/bash"]
          EOF

      - name: Build and test Docker image
        run: |
          docker build -t pc-config .
          sed -i 's/^install_snaps/# install_snaps/' Linux/Ubuntu.zsh
          docker run --rm --mount=type=bind,source="$(pwd)",target=/root/.config/pc-config pc-config \
            bash -c 'cd /root/.config/pc-config; bash install.sh'
